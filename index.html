<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F5F1E7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Словничок">
<title>Словничок</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<div id="app">
  <div class="brand">
    <span class="brand-mark">✒</span>
    <h1>Словничок</h1>
    <span class="sub">англійські слова, ідіоми та граматика</span>
  </div>

  <nav class="tabs" role="tablist">
    <button class="tab active" data-tab="practice">Практика</button>
    <button class="tab" data-tab="grammar">Граматика</button>
    <button class="tab" data-tab="add">Додати</button>
    <button class="tab" data-tab="library">Словник</button>
    <button class="tab" data-tab="settings" title="Синхронізація та бекап"><span aria-hidden="true">☁</span><span class="tab-text"> Синхронізація</span></button>
  </nav>

  <main class="surface">
    <div id="statsStrip" class="stat-strip"></div>

    <section id="panel-practice" class="panel active"></section>
    <section id="panel-grammar" class="panel"></section>
    <section id="panel-add" class="panel"></section>
    <section id="panel-library" class="panel"></section>
    <section id="panel-settings" class="panel"></section>
  </main>

  <footer class="foot">
    <span id="syncStatus"></span>
  </footer>
</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
